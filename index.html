<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Papa's Freezeria</title>

    <script src="ruffle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        ruffle-player {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

    <ruffle-player></ruffle-player>

    <script>
        const player = document.querySelector("ruffle-player");

        player.config = {
            autoplay: "on",
            unmuteOverlay: "hidden"
        };

        player.load("freezeria.swf");
    </script>

</body>
</html>
